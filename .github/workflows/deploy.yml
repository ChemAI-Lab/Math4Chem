name: Deploy MyST site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  # BASE_URL is the path the site is served from.
  # Project page (https://<user>.github.io/<repo>): must be "/<repo>".
  # User/org page (repo named <user>.github.io): set to '' instead.
  BASE_URL: /${{ github.event.repository.name }}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
      - name: Install MyST Markdown
        run: npm install -g mystmd
      - name: Build HTML assets
        run: myst build --html
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "./_build/html"
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
